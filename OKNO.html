<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Игральный кубик — вид сверху</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a2e;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #info {
      position: absolute;
      bottom: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 16px;
      pointer-events: none;
      user-select: none;
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="info">Нажми на кубик или пробел</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // --- СЦЕНА ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // --- КАМЕРА (строго сверху) ---
    const camera = new THREE.OrthographicCamera(-3, 3, 3, -3, 0.1, 10);
    camera.position.set(0, 5, 0);
    camera.lookAt(0, 0, 0);

    // --- РЕНДЕРЕР ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- ОСВЕЩЕНИЕ ---
    const ambient = new THREE.AmbientLight(0x404060, 0.5);
    scene.add(ambient);

    const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    mainLight.position.set(0, 5, 3);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 512;
    mainLight.shadow.mapSize.height = 512;
    mainLight.shadow.camera.near = 0.1;
    mainLight.shadow.camera.far = 10;
    mainLight.shadow.camera.left = -3;
    mainLight.shadow.camera.right = 3;
    mainLight.shadow.camera.top = 3;
    mainLight.shadow.camera.bottom = -3;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
    fillLight.position.set(-2, 1, -2);
    scene.add(fillLight);

    // --- СОЗДАНИЕ ТЕКСТУР С ТОЧКАМИ ---
    function createFaceTexture(dots) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, 256, 256);
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.strokeRect(4, 4, 248, 248);

      ctx.fillStyle = '#1a1a2e';
      const dotRadius = 20;
      const positions = {
        1: [[128, 128]],
        2: [[68, 68], [188, 188]],
        3: [[68, 68], [128, 128], [188, 188]],
        4: [[68, 68], [188, 68], [68, 188], [188, 188]],
        5: [[68, 68], [188, 68], [128, 128], [68, 188], [188, 188]],
        6: [[68, 68], [188, 68], [68, 128], [188, 128], [68, 188], [188, 188]]
      };

      (positions[dots] || []).forEach(p => {
        ctx.beginPath();
        ctx.arc(p[0], p[1], dotRadius, 0, Math.PI * 2);
        ctx.fill();
      });

      return new THREE.CanvasTexture(canvas);
    }

    // --- СОЗДАНИЕ КУБИКА ---
    const cubeGroup = new THREE.Group();
    scene.add(cubeGroup);

    const size = 1.8;
    const half = size / 2;
    const faceSize = size * 0.96;

    // Материалы для каждой грани
    const materials = {};
    for (let i = 1; i <= 6; i++) {
      materials[i] = new THREE.MeshStandardMaterial({
        map: createFaceTexture(i),
        roughness: 0.3,
        metalness: 0.05,
        side: THREE.DoubleSide
      });
    }

    // Позиции и повороты граней (нормали направлены наружу)
    const faceData = [
      { pos: [half, 0, 0], rot: [0, Math.PI/2, 0], num: 3 },
      { pos: [-half, 0, 0], rot: [0, -Math.PI/2, 0], num: 2 },
      { pos: [0, half, 0], rot: [-Math.PI/2, 0, 0], num: 5 },
      { pos: [0, -half, 0], rot: [Math.PI/2, 0, 0], num: 6 },
      { pos: [0, 0, half], rot: [0, 0, 0], num: 1 },
      { pos: [0, 0, -half], rot: [0, Math.PI, 0], num: 4 }
    ];

    faceData.forEach(data => {
      const geom = new THREE.PlaneGeometry(faceSize, faceSize);
      const mesh = new THREE.Mesh(geom, materials[data.num]);
      mesh.position.set(data.pos[0], data.pos[1], data.pos[2]);
      mesh.rotation.set(data.rot[0], data.rot[1], data.rot[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      cubeGroup.add(mesh);

      // Рамка
      const edgeGeom = new THREE.EdgesGeometry(geom);
      const edgeMat = new THREE.LineBasicMaterial({ color: 0x888899, transparent: true, opacity: 0.15 });
      const wire = new THREE.LineSegments(edgeGeom, edgeMat);
      wire.position.copy(mesh.position);
      wire.rotation.copy(mesh.rotation);
      cubeGroup.add(wire);
    });

    // --- ТЕНЬ (круг под кубиком) ---
    const shadowGeom = new THREE.CircleGeometry(1.0, 16);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.4,
      depthWrite: false
    });
    const shadow = new THREE.Mesh(shadowGeom, shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -0.95;
    scene.add(shadow);

    // --- ЛОГИКА БРОСКА ---
    let isRolling = false;
    const ANIMATION_DURATION = 1200; // мс
    let rollStartTime = 0;
    let startQuat = new THREE.Quaternion();
    let targetQuat = new THREE.Quaternion();
    let currentValue = 1;

    // Функция получения кватерниона для верхней грани (нормаль +Y)
    function getQuaternionForValue(value) {
      const up = new THREE.Vector3(0, 1, 0);
      // Нормали граней (в локальных координатах куба)
      const normals = {
        1: new THREE.Vector3(0, 0, 1),   // +Z
        2: new THREE.Vector3(-1, 0, 0),  // -X
        3: new THREE.Vector3(1, 0, 0),   // +X
        4: new THREE.Vector3(0, 0, -1),  // -Z
        5: new THREE.Vector3(0, 1, 0),   // +Y
        6: new THREE.Vector3(0, -1, 0)   // -Y
      };
      const normal = normals[value];
      if (!normal) return new THREE.Quaternion();
      const quat = new THREE.Quaternion().setFromUnitVectors(normal, up);
      return quat;
    }

    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      // Случайное число
      currentValue = Math.floor(Math.random() * 6) + 1;
      console.log(`🎲 Выпало: ${currentValue}`);

      // Сохраняем текущий кватернион
      startQuat.copy(cubeGroup.quaternion);

      // Целевой кватернион для выпавшей грани
      const baseQuat = getQuaternionForValue(currentValue);

      // Добавляем случайные полные обороты для эффекта вращения
      const extraRot = new THREE.Quaternion();
      const axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
      const angle = (2 + Math.random() * 3) * Math.PI * 2; // от 2 до 5 полных оборотов
      extraRot.setFromAxisAngle(axis, angle);

      // Целевой = базовый * дополнительные обороты (сначала база, потом доп)
      // Чтобы кубик остановился в правильной ориентации, нужно чтобы базовый был последним?
      // Лучше: умножаем базовый на доп, чтобы доп вращение было вокруг мировых осей? 
      // Но для простоты используем: targetQuat = baseQuat * extraRot, но тогда порядок важен.
      // Обычно: сначала применяем extraRot (в локальных координатах), потом baseQuat.
      // Но мы хотим, чтобы финальная ориентация была baseQuat, а во время анимации кубик крутился.
      // Поэтому мы можем умножить baseQuat на extraRot с одной стороны.
      // Проще: targetQuat = baseQuat.clone().multiply(extraRot);
      // Это даст итоговый поворот, где baseQuat применяется после extraRot? 
      // В Three.js умножение q1.multiply(q2) означает q1 * q2 (сначала q2, потом q1).
      // Так что если мы сделаем targetQuat = baseQuat.multiply(extraRot), то сначала применится extraRot (дополнительные обороты), затем baseQuat.
      // Это даст финальную ориентацию baseQuat, но с дополнительным вращением, которое в итоге скомпенсируется? Нет, умножение не коммутативно.
      // Чтобы получить вращение с последующей остановкой на baseQuat, мы можем просто интерполировать от текущего к baseQuat, но добавить случайные обороты в процессе.
      // Более простой способ: интерполируем от текущего кватерниона к целевому, который равен baseQuat, но добавляем случайные значения в начальный момент.
      // Сделаем так: во время анимации мы будем вычислять промежуточный кватернион, который сначала сильно отклоняется, а затем приходит к baseQuat.
      // Для этого можно использовать сферическую интерполяцию с дополнительным вращением, но проще: задать targetQuat = baseQuat, а в процессе анимации добавить вращение, которое затухает.
      // Или: при старте мы добавляем случайный поворот к startQuat, а затем интерполируем к baseQuat.
      // Но мы уже сохранили startQuat как текущий. Мы можем в начале анимации установить кубик в некоторое случайное положение (с большим вращением), а затем анимировать к baseQuat.
      // Однако это вызовет рывок. Лучше: использовать два этапа: первый этап - быстрое вращение с постоянной скоростью, второй - замедление и остановка на baseQuat.
      // Но для простоты можно сделать так: мы интерполируем от startQuat к baseQuat, но добавляем синусоидальные колебания, которые затухают.
      // Однако проще всего - использовать обычную интерполяцию от startQuat к baseQuat с дополнительным вращением, которое вычисляется как функция времени.
      // Мы можем взять targetQuat = baseQuat, а во время анимации вычислять промежуточный кватернион = startQuat * (дополнительное вращение, которое затухает) и затем интерполировать к baseQuat.
      // Это сложно. 
      // Самый простой и надежный способ: задать целевой кватернион как baseQuat, а во время анимации добавить случайные вращения, которые постепенно уменьшаются до нуля.
      // Для этого мы будем вычислять финальный кватернион как baseQuat * (дополнительное вращение, зависящее от времени, с затуханием). 
      // Но тогда финальный кватернион не будет точно baseQuat в конце, если затухание не до нуля.
      // Лучше: интерполируем от startQuat к baseQuat с помощью slerp, но добавляем к углу поворота случайную величину, которая уменьшается.
      // Я предлагаю использовать такой подход: 
      // 1. Сохраняем startQuat.
      // 2. Генерируем случайные углы для вращения вокруг осей X, Y, Z (большие).
      // 3. Создаем дополнительный кватернион из этих углов.
      // 4. Целевой кватернион = baseQuat (без дополнительных оборотов).
      // 5. В процессе анимации мы вычисляем промежуточный кватернион как slerp между startQuat и targetQuat, но с добавлением дополнительного вращения, которое затухает.
      // Вместо этого можно просто анимировать углы Эйлера, так как это проще для понимания.
      // Давайте вернемся к углам Эйлера. Мы знаем точные углы для каждой грани. При клике мы берем текущие углы, генерируем целевые углы (те, которые дают нужную грань) и добавляем большие случайные значения. Затем анимируем интерполяцию с замедлением.
      // Так мы уже делали ранее. Это работает.

      // Возвращаемся к углам Эйлера.
      // Функция получения целевых углов (в радианах) для верхней грани
      function getTargetAngles(value) {
        const angles = {
          1: { x: -Math.PI/2, y: 0, z: 0 },
          2: { x: -Math.PI/2, y: 0, z: -Math.PI/2 },
          3: { x: -Math.PI/2, y: 0, z: Math.PI/2 },
          4: { x: -Math.PI/2, y: 0, z: Math.PI },
          5: { x: 0, y: 0, z: 0 },
          6: { x: Math.PI, y: 0, z: 0 }
        };
        return angles[value] || angles[1];
      }

      // Сохраняем начальные углы
      const startAngles = {
        x: cubeGroup.rotation.x,
        y: cubeGroup.rotation.y,
        z: cubeGroup.rotation.z
      };

      const base = getTargetAngles(currentValue);

      // Добавляем случайные полные обороты
      const extraX = (2 + Math.random() * 3) * Math.PI * 2;
      const extraY = (2 + Math.random() * 3) * Math.PI * 2;
      const extraZ = (1 + Math.random() * 2) * Math.PI * 2;

      const targetAngles = {
        x: base.x + extraX * (Math.random() > 0.5 ? 1 : -1),
        y: base.y + extraY * (Math.random() > 0.5 ? 1 : -1),
        z: base.z + extraZ * (Math.random() > 0.5 ? 1 : -1)
      };

      // Сохраняем для анимации
      window._rollData = {
        startAngles,
        targetAngles,
        startTime: performance.now(),
        duration: ANIMATION_DURATION
      };

      rollStartTime = performance.now();
      startQuat.copy(cubeGroup.quaternion);
      // Для совместимости сохраним targetQuat как кватернион из targetAngles
      targetQuat.setFromEuler(new THREE.Euler(targetAngles.x, targetAngles.y, targetAngles.z));
    }

    // Обработчики
    renderer.domElement.addEventListener('click', rollDice);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        rollDice();
      }
    });

    // --- АНИМАЦИЯ ---
    function animate() {
      requestAnimationFrame(animate);

      if (isRolling) {
        const data = window._rollData;
        if (data) {
          const elapsed = performance.now() - data.startTime;
          let progress = Math.min(elapsed / data.duration, 1);
          // easeOutCubic
          const ease = 1 - Math.pow(1 - progress, 3);

          // Интерполяция углов
          const currentX = data.startAngles.x + (data.targetAngles.x - data.startAngles.x) * ease;
          const currentY = data.startAngles.y + (data.targetAngles.y - data.startAngles.y) * ease;
          const currentZ = data.startAngles.z + (data.targetAngles.z - data.startAngles.z) * ease;

          cubeGroup.rotation.x = currentX;
          cubeGroup.rotation.y = currentY;
          cubeGroup.rotation.z = currentZ;

          if (progress >= 1) {
            isRolling = false;
            // Фиксируем конечные углы
            cubeGroup.rotation.x = data.targetAngles.x;
            cubeGroup.rotation.y = data.targetAngles.y;
            cubeGroup.rotation.z = data.targetAngles.z;
          }
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // --- АДАПТАЦИЯ ПОД РАЗМЕР ---
    window.addEventListener('resize', () => {
      const aspect = window.innerWidth / window.innerHeight;
      const frustumSize = 6;
      camera.left = -frustumSize * aspect / 2;
      camera.right = frustumSize * aspect / 2;
      camera.top = frustumSize / 2;
      camera.bottom = -frustumSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Первый бросок
    setTimeout(() => rollDice(), 300);

    console.log('🎲 Кубик готов! Кликни или пробел.');
  </script>
</body>
</html>
